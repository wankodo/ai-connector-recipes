name: Auto-merge community recipes

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge if the PR only touches community/*.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "Changed files:"
          echo "$files"
          ok=1
          count=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            count=$((count+1))
            case "$f" in
              community/*.md) ;;
              *) ok=0 ;;
            esac
          done <<< "$files"
          if [ "$ok" = "1" ] && [ "$count" -gt 0 ]; then
            gh pr merge "$PR" --repo "$REPO" --merge
            echo "Auto-merged community PR #$PR"
          else
            echo "Not community-only; left for manual review."
          fi
